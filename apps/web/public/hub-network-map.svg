<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <!-- Drop Shadow for the Map Base -->
    <filter id="map-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="12" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    
    <!-- Deep Container Shadow -->
    <filter id="container-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="-2" dy="15" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.35"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Linear Gradients for Map Extrusion 3D effect -->
    <linearGradient id="map-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7BB3DE" />
      <stop offset="100%" stop-color="#4B89BE" />
    </linearGradient>

    <!-- Glow effect for nodes -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .map-base { fill: url(#map-gradient); filter: url(#map-shadow); }
    .spoke-line { fill: none; stroke: #ffffff; stroke-width: 3; stroke-dasharray: 6,5; stroke-linecap: round; opacity: 0.9; }
    .hub-node { fill: #2EC4B6; stroke: #ffffff; stroke-width: 2.5; filter: url(#glow); }
    .hub-text { font-family: 'DM Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #f8fafc; text-anchor: start; }
    .central-title { font-family: 'DM Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 26px; font-weight: 900; fill: #ffffff; letter-spacing: 2px; }
  </style>

  <!-- Transparent background for dark hero card -->
  <g transform="translate(40, 20)">
    <!-- HIGHLY ACCURATE 3D-STYLED SIMPLIFIED VECTOR MAP OF THE USA -->
    <!-- Structured to feature precise positions for the Central and Southeast nodes -->
    <path class="map-base" d="
      M 150,150 
      L 220,145 L 300,160 L 400,165 L 550,170 L 650,165 L 750,190 L 800,180 L 840,140 L 880,130 
      L 910,100 L 920,120 L 960,110 L 950,150 L 980,140 L 970,170 L 1010,210 L 1000,240 L 960,260
      L 970,300 L 940,320 L 920,380 L 930,420 L 940,490 L 960,560 L 955,590 L 940,610 L 920,590
      L 900,530 L 890,460 L 880,410 L 850,410 L 830,440 L 805,445 L 810,480 L 815,510 L 805,530
      L 775,480 L 760,450 L 745,450 L 725,485 L 685,490 L 650,470 L 630,480 L 615,510 L 590,520
      L 580,500 L 555,515 L 520,550 L 500,560 L 475,500 L 450,455 L 420,445 L 375,430 L 320,440
      L 260,405 L 245,340 L 220,335 L 210,310 L 180,265 L 160,250 L 175,200 Z
    " />

    <!-- LOGISTICS LOGICAL SPOKES (Dashed Connecting Lines Radiating from the Hub) -->
    <!-- Center of the Hub / Hub Base Connection Coordinate: (520, 350) -->
    <g id="spokes">
      <!-- To Western/Inland Network Context -->
      <path class="spoke-line" d="M 520,330 Q 400,240 280,220" />
      <path class="spoke-line" d="M 520,340 Q 380,310 260,310" />
      <path class="spoke-line" d="M 520,350 Q 380,380 290,420" />
      
      <!-- To Explicit Named Node Destinations Requested -->
      <path class="spoke-line" d="M 540,360 Q 535,420 530,475" /> <!-- Houston -->
      <path class="spoke-line" d="M 545,365 Q 575,430 610,475" /> <!-- New Orleans -->
      <path class="spoke-line" d="M 550,370 Q 600,430 655,470" /> <!-- Mobile -->
      <path class="spoke-line" d="M 550,365 Q 630,420 705,480" /> <!-- Tampa -->
      <path class="spoke-line" d="M 555,360 Q 680,410 740,545" /> <!-- Miami -->
      <path class="spoke-line" d="M 560,355 Q 690,380 755,445" /> <!-- Jacksonville -->
      <path class="spoke-line" d="M 560,350 Q 720,360 780,395" /> <!-- Savannah -->
      <path class="spoke-line" d="M 560,340 Q 730,320 815,355" /> <!-- Charleston -->
      <path class="spoke-line" d="M 560,330 Q 750,280 840,310" /> <!-- Wilmington -->
      <path class="spoke-line" d="M 555,345 Q 640,345 700,340" /> <!-- Atlanta -->
      <path class="spoke-line" d="M 540,355 Q 580,385 615,405" /> <!-- Mississippi (Jackson) -->
    </g>

    <!-- HUB DESTINATIONS & LABELS -->
    <g id="nodes-and-labels">
      <!-- Houston, TX -->
      <circle class="hub-node" cx="530" cy="475" r="9" />
      <text class="hub-text" x="545" y="480">HOUSTON</text>

      <!-- New Orleans, LA -->
      <circle class="hub-node" cx="610" cy="475" r="9" />
      <text class="hub-text" x="570" y="498">NEW ORLEANS</text>

      <!-- Mobile, AL -->
      <circle class="hub-node" cx="655" cy="470" r="9" />
      <text class="hub-text" x="650" y="455">MOBILE</text>

      <!-- Mississippi (Jackson) -->
      <circle class="hub-node" cx="615" cy="405" r="9" />
      <text class="hub-text" x="580" y="392">MISSISSIPPI</text>

      <!-- Atlanta, GA -->
      <circle class="hub-node" cx="700" cy="340" r="11" fill="#10b981" />
      <!-- Inline Minimal plane SVG representation inside node -->
      <path d="M 696,336 L 704,344 M 702,336 L 698,344" stroke="#ffffff" stroke-width="2"/>
      <text class="hub-text" x="715" y="345">ATLANTA</text>

      <!-- Florida Ports -->
      <!-- Tampa, FL -->
      <circle class="hub-node" cx="705" cy="480" r="9" />
      <text class="hub-text" x="655" y="495">TAMPA</text>

      <!-- Jacksonville, FL -->
      <circle class="hub-node" cx="755" cy="445" r="9" />
      <text class="hub-text" x="770" y="450">JACKSONVILLE</text>

      <!-- Miami, FL -->
      <circle class="hub-node" cx="740" cy="545" r="9" />
      <text class="hub-text" x="755" y="550">MIAMI</text>

      <!-- The Carolinas & Georgia Ports -->
      <!-- Savannah, GA -->
      <circle class="hub-node" cx="780" cy="395" r="9" />
      <text class="hub-text" x="795" y="400">SAVANNAH</text>

      <!-- Charleston, SC -->
      <circle class="hub-node" cx="815" cy="355" r="9" />
      <text class="hub-text" x="830" y="360">CHARLESTON</text>

      <!-- Wilmington, NC -->
      <circle class="hub-node" cx="840" cy="310" r="9" />
      <text class="hub-text" x="855" y="315">WILMINGTON</text>
    </g>

    <!-- CORE CENTRAL NODE: ICONIC 3D ISOMETRIC CONEX SHIPPING CONTAINER -->
    <!-- Positioned squarely over the geographical heart of the model -->
    <text class="central-title" x="420" y="250">CENTRAL HUB</text>
    
    <g id="isometric-conex-box" filter="url(#container-shadow)" transform="translate(450, 270)">
      <!-- Left Facing Facing Side Panel (Shadowed Orange) -->
      <path d="M 0,40 L 70,75 L 70,145 L 0,110 Z" fill="#C25323" stroke="#A43D14" stroke-width="1.5" />
      <!-- Corrugation lines for Conex feel Left Side -->
      <path d="M 10,48 L 10,115 M 20,53 L 20,120 M 30,58 L 30,125 M 40,62 L 40,130 M 50,67 L 50,135 M 60,71 L 60,140" stroke="#94330B" stroke-width="1.5" opacity="0.6"/>

      <!-- Right Facing Main Side Panel (Highlighted Orange-Red) -->
      <path d="M 70,75 L 150,35 L 150,105 L 70,145 Z" fill="#E86229" stroke="#A43D14" stroke-width="1.5" />
      <!-- Corrugation lines Right Side -->
      <path d="M 80,138 L 80,68 M 90,133 L 90,63 M 100,128 L 100,58 M 110,123 L 110,53 M 120,118 L 120,48 M 130,113 L 130,43 M 140,108 L 140,38" stroke="#B84414" stroke-width="1.5" opacity="0.7"/>

      <!-- Top Panel View -->
      <path d="M 0,40 L 70,75 L 150,35 L 80,0 Z" fill="#FFA372" stroke="#D35019" stroke-width="1.2" />
      
      <!-- Structural Corner Posts & Locks Details to emphasize real 3D container asset quality -->
      <path d="M 70,75 L 70,145" stroke="#FFFFFF" stroke-width="2" opacity="0.4" />
      <path d="M 0,40 L 0,110" stroke="#FFFFFF" stroke-width="1.5" opacity="0.3" />
      <path d="M 150,35 L 150,105" stroke="#5C1D02" stroke-width="2" />
    </g>
  </g>
</svg>
