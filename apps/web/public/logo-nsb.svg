<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="National SteelBox — Buy, Ship, Deliver">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F6F9"/>
      <stop offset=".45" stop-color="#C9D2DC"/>
      <stop offset=".55" stop-color="#AEB9C6"/>
      <stop offset="1" stop-color="#E8ECF1"/>
    </linearGradient>
    <linearGradient id="steelDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4E9EF"/>
      <stop offset="1" stop-color="#B7C1CC"/>
    </linearGradient>
    <linearGradient id="blueBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E7BD6"/>
      <stop offset="1" stop-color="#0D4FA6"/>
    </linearGradient>
    <linearGradient id="redBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D64545"/>
      <stop offset="1" stop-color="#A31F2B"/>
    </linearGradient>
    <linearGradient id="tanBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCC9A5"/>
      <stop offset="1" stop-color="#B49A6C"/>
    </linearGradient>
    <linearGradient id="greyBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9AA4B0"/>
      <stop offset="1" stop-color="#66707C"/>
    </linearGradient>
  </defs>

  <!-- Waving flag backdrop -->
  <g opacity=".95">
    <path d="M96 96 Q180 56 320 66 Q470 76 552 46 L560 150 Q470 178 330 168 Q190 158 104 190 Z" fill="#B22234"/>
    <path d="M99 120 Q185 84 322 92 Q468 102 554 74 L557 100 Q468 128 324 118 Q188 110 101 144 Z" fill="#fff"/>
    <path d="M102 156 Q188 122 326 130 Q466 140 557 116 L559 138 Q468 164 328 154 Q192 146 104 178 Z" fill="#fff"/>
    <rect x="96" y="58" width="150" height="94" rx="6" fill="#1B2E57"/>
    <g fill="#fff">
      <path d="M120 76l3.2 6.6 7.2 1-5.2 5 1.2 7.1-6.4-3.4-6.4 3.4 1.2-7.1-5.2-5 7.2-1z"/>
      <path d="M162 76l3.2 6.6 7.2 1-5.2 5 1.2 7.1-6.4-3.4-6.4 3.4 1.2-7.1-5.2-5 7.2-1z"/>
      <path d="M204 76l3.2 6.6 7.2 1-5.2 5 1.2 7.1-6.4-3.4-6.4 3.4 1.2-7.1-5.2-5 7.2-1z"/>
      <path d="M141 108l3.2 6.6 7.2 1-5.2 5 1.2 7.1-6.4-3.4-6.4 3.4 1.2-7.1-5.2-5 7.2-1z"/>
      <path d="M183 108l3.2 6.6 7.2 1-5.2 5 1.2 7.1-6.4-3.4-6.4 3.4 1.2-7.1-5.2-5 7.2-1z"/>
    </g>
  </g>

  <!-- Container stack -->
  <g stroke="#12203F" stroke-width="3">
    <g fill="url(#greyBox)">
      <rect x="452" y="120" width="120" height="80" rx="3"/>
      <path d="M472 120v80M492 120v80M512 120v80M532 120v80M552 120v80" stroke="#4A5560" stroke-width="4"/>
      <rect x="452" y="120" width="120" height="80" rx="3" fill="none"/>
    </g>
    <g fill="url(#redBox)">
      <rect x="118" y="128" width="96" height="78" rx="3"/>
      <path d="M136 128v78M154 128v78M172 128v78M190 128v78" stroke="#7E1620" stroke-width="4"/>
      <rect x="118" y="128" width="96" height="78" rx="3" fill="none"/>
    </g>
    <g fill="url(#tanBox)">
      <rect x="196" y="112" width="104" height="94" rx="3"/>
      <path d="M216 112v94M236 112v94M256 112v94M276 112v94" stroke="#8A7348" stroke-width="4"/>
      <rect x="196" y="112" width="104" height="94" rx="3" fill="none"/>
    </g>
    <!-- Hero blue 40ft: front + receding side -->
    <g>
      <path d="M290 96 L448 78 L448 196 L290 206 Z" fill="url(#blueBox)"/>
      <path d="M306 95.5v108M322 94v108M338 92.5v109M354 91v109M370 89.5v109M386 88v109M402 86.5v109M418 85v109M434 83.5v110" stroke="#0A3A7A" stroke-width="5" fill="none"/>
      <path d="M290 96 L448 78 L448 196 L290 206 Z" fill="none"/>
      <rect x="248" y="90" width="46" height="118" rx="3" fill="url(#blueBox)"/>
      <path d="M258 96v106M284 96v106" stroke="#CFE0F5" stroke-width="2.5" fill="none"/>
      <path d="M256 102h10M256 132h10M280 102h10M280 132h10" stroke="#CFE0F5" stroke-width="2.5" fill="none"/>
      <rect x="248" y="90" width="46" height="118" rx="3" fill="none"/>
    </g>
  </g>

  <!-- Main steel plate: NATIONAL -->
  <g>
    <path d="M44 206 L596 206 L620 234 L604 296 L36 296 L20 234 Z" fill="#1B2E57"/>
    <path d="M52 212 L588 212 L610 236 L596 289 L44 289 L30 236 Z" fill="url(#steel)"/>
    <circle cx="58" cy="250" r="4" fill="#8E99A6"/><circle cx="582" cy="250" r="4" fill="#8E99A6"/>
    <text x="320" y="272" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="68" letter-spacing="2" fill="#243B6B" stroke="#1B2E57" stroke-width="2">NATIONAL</text>
    <path d="M320 224l4 8.2 9 1.3-6.5 6.3 1.5 9-8-4.2-8 4.2 1.5-9-6.5-6.3 9-1.3z" fill="#1B2E57" transform="translate(-152,6) scale(.9)"/>
  </g>

  <!-- White plate: STEELBOX.COM -->
  <g>
    <rect x="88" y="300" width="464" height="54" rx="8" fill="#1B2E57"/>
    <rect x="94" y="305" width="452" height="44" rx="6" fill="url(#steelDark)"/>
    <rect x="98" y="308" width="444" height="38" rx="5" fill="#FDFEFF"/>
    <circle cx="108" cy="327" r="3.4" fill="#8E99A6"/><circle cx="532" cy="327" r="3.4" fill="#8E99A6"/>
    <text x="240" y="340" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="36" letter-spacing="1" fill="#C22B33">STEEL<tspan fill="#1B2E57">BOX</tspan></text>
    <text x="452" y="340" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="30" fill="#243B6B">.COM</text>
  </g>

  <!-- Banner: BUY ★ SHIP ★ DELIVER -->
  <g>
    <path d="M150 362 L490 362 L470 392 L170 392 Z" fill="#C22B33"/>
    <text x="320" y="383" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="19" letter-spacing="4" fill="#fff">BUY ★ SHIP ★ DELIVER</text>
  </g>
</svg>
